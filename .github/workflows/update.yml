name: Diagnose Vienna Opera Calendar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Inspect official opera calendar
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = (
              "https://www.wiener-staatsoper.at/"
              "kalender/oper/2026/november/"
          )

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=35
          )

          print("HTTP status:", r.status_code)
          print("Final URL:", r.url)
          print("HTML length:", len(r.text))

          r.raise_for_status()

          soup = BeautifulSoup(r.text, "html.parser")
          print("Page title:", soup.title.get_text(" ", strip=True) if soup.title else "None")

          for tag in soup(["script", "style", "noscript", "svg"]):
              tag.decompose()

          lines = [
              line.strip()
              for line in soup.get_text("\n", strip=True).splitlines()
              if line.strip()
          ]

          print("Text lines:", len(lines))
          print("Opera markers:", sum("Oper Großer Saal" in x for x in lines))
          print("Otello occurrences:", sum("Otello" in x for x in lines))

          print("FIRST 100 TEXT LINES:")
          for i, line in enumerate(lines[:100], 1):
              print(f"{i:03d}: {line[:200]}")
          PY
