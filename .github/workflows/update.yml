name: Update Vienna State Opera calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python operabook_calendar.py
      - name: Commit updated subscriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vienna-opera.ics vienna-ticket-sales.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Update Vienna opera subscriptions'
            git push
          fi
